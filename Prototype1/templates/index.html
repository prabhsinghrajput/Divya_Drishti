<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya drishti</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Main content area */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            flex: 1;
        }

        /* Video section */
        .video-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }

        #videoFeed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .video-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
        }

        .status-indicator {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-live {
            color: #4ade80;
        }

        .status-paused {
            color: #f87171;
        }

        /* Control panel */
        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            height: fit-content;
        }

        .control-section {
            margin-bottom: 25px;
        }

        .control-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffffff;
            opacity: 0.9;
        }

        /* Button styles */
        .btn-group {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-group.two-col {
            grid-template-columns: 1fr 1fr;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Button variants */
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .btn-success {
            background: linear-gradient(135deg, #4ade80, #22c55e);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .btn-info {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
        }

        .btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* Status display */
        .status-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .status-value {
            font-weight: 600;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            font-size: 0.85rem;
        }

        .status-on {
            color: #4ade80;
        }

        .status-off {
            color: #f87171;
        }

        /* Calibration controls */
        .calibration-controls {
            display: grid;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .input-group input {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .control-panel {
                order: -1;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .btn-group.two-col {
                grid-template-columns: 1fr;
            }
            
            .control-panel {
                padding: 20px;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Smooth transitions */
        .btn, .status-value, .input-group input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* High DPI support for MacBook displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            body {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯Divya Drishti</h1>
            <p>Real-time object detection, text recognition & distance estimation</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Video Section -->
            <div class="video-section">
                <div class="video-container">
                    <img id="videoFeed" src="/video_feed" alt="Video Feed">
                    <div class="video-overlay">
                        <span id="statusIndicator" class="status-indicator status-live">
                            🔴 LIVE
                        </span>
                    </div>
                </div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <!-- Camera Controls -->
                <div class="control-section">
                    <div class="section-title">📹 Camera Controls</div>
                    <div class="btn-group two-col">
                        <button id="resumeBtn" class="btn btn-success active" onclick="resumeCamera()">
                            ▶️ Resume
                        </button>
                        <button id="pauseBtn" class="btn btn-danger" onclick="pauseCamera()">
                            ⏸️ Pause
                        </button>
                    </div>
                </div>

                <!-- Detection Modes -->
                <div class="control-section">
                    <div class="section-title">🔍 Detection Modes</div>
                    <div class="btn-group">
                        <button id="objectsBtn" class="btn btn-primary active" onclick="setMode('objects')">
                            🎯 Objects Mode
                        </button>
                        <button id="directionalBtn" class="btn btn-success" onclick="setMode('directional')">
                            🧭 Directional Mode
                        </button>
                        <button id="distanceBtn" class="btn btn-info" onclick="setMode('distance')">
                            📏 Distance Mode
                        </button>
                        <button id="textBtn" class="btn btn-warning" onclick="setMode('text')">
                            📝 Text Mode
                        </button>
                    </div>
                </div>

                <!-- Speech Controls -->
                <div class="control-section">
                    <div class="section-title">🔊 Speech Controls</div>
                    <div class="btn-group two-col">
                        <button id="startSpeechBtn" class="btn btn-success active" onclick="startSpeech()">
                            🔊 On
                        </button>
                        <button id="stopSpeechBtn" class="btn btn-danger" onclick="stopSpeech()">
                            🔇 Off
                        </button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-info" onclick="testSpeech()">
                            🎤 Test Speech
                        </button>
                    </div>
                </div>

                <!-- Status Display -->
                <div class="control-section">
                    <div class="section-title">📊 System Status</div>
                    <div class="status-display">
                        <div class="status-item">
                            <span class="status-label">Camera:</span>
                            <span id="cameraStatus" class="status-value status-on">ON</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Mode:</span>
                            <span id="modeStatus" class="status-value">OBJECTS</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Speech:</span>
                            <span id="speechStatus" class="status-value status-on">ON</span>
                        </div>
                    </div>
                </div>

                <!-- Calibration Controls -->
                <div class="control-section">
                    <div class="section-title">⚙️ Distance Calibration</div>
                    <div class="calibration-controls">
                        <div class="input-group">
                            <label for="knownWidth">Object Width (meters):</label>
                            <input type="number" id="knownWidth" step="0.1" value="0.3" placeholder="0.3">
                        </div>
                        <div class="input-group">
                            <label for="focalLength">Focal Length (pixels):</label>
                            <input type="number" id="focalLength" step="50" value="500" placeholder="500">
                        </div>
                        <button class="btn btn-info" onclick="calibrateDistance()">
                            🎯 Apply Calibration
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API helper function
        async function apiCall(endpoint, method = 'POST') {
            try {
                const response = await fetch(endpoint, { method });
                const data = await response.json();
                console.log(`${endpoint}:`, data);
                return data;
            } catch (error) {
                console.error(`Error calling ${endpoint}:`, error);
                return null;
            }
        }

        // Camera controls
        async function pauseCamera() {
            const result = await apiCall('/pause');
            if (result) {
                updateButtonStates('camera', 'pause');
                document.getElementById('statusIndicator').className = 'status-indicator status-paused';
                document.getElementById('statusIndicator').innerHTML = '⏸️ PAUSED';
                updateStatus();
            }
        }

        async function resumeCamera() {
            const result = await apiCall('/resume');
            if (result) {
                updateButtonStates('camera', 'resume');
                document.getElementById('statusIndicator').className = 'status-indicator status-live';
                document.getElementById('statusIndicator').innerHTML = '🔴 LIVE';
                updateStatus();
            }
        }

        // Mode controls
        async function setMode(mode) {
            let endpoint;
            switch(mode) {
                case 'objects':
                    endpoint = '/scan_objects';
                    break;
                case 'directional':
                    endpoint = '/directional_mode';
                    break;
                case 'distance':
                    endpoint = '/distance_mode';
                    break;
                case 'text':
                    endpoint = '/scan_text';
                    break;
                default:
                    return;
            }
            
            const result = await apiCall(endpoint);
            if (result) {
                updateButtonStates('mode', mode);
                updateStatus();
            }
        }

        // Speech controls
        async function startSpeech() {
            const result = await apiCall('/start_speech');
            if (result) {
                updateButtonStates('speech', 'start');
                updateStatus();
            }
        }

        async function stopSpeech() {
            const result = await apiCall('/stop_speech');
            if (result) {
                updateButtonStates('speech', 'stop');
                updateStatus();
            }
        }

        // Test speech function
        async function testSpeech() {
            console.log('Testing speech...');
            const result = await apiCall('/test_speech');
            if (result) {
                console.log('Speech test result:', result);
                // Show visual feedback
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = '🎤 Testing...';
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 3000);
            }
        }

        // Calibration
        async function calibrateDistance() {
            const knownWidth = parseFloat(document.getElementById('knownWidth').value);
            const focalLength = parseFloat(document.getElementById('focalLength').value);
            
            if (isNaN(knownWidth) || isNaN(focalLength)) {
                alert('Please enter valid numbers for calibration');
                return;
            }
            
            try {
                const response = await fetch('/calibrate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        known_width: knownWidth,
                        focal_length: focalLength
                    })
                });
                
                const result = await response.json();
                if (result) {
                    console.log('Calibration applied:', result);
                    // Show temporary success indication
                    const btn = event.target;
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '✅ Applied!';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.background = '';
                    }, 2000);
                }
            } catch (error) {
                console.error('Calibration error:', error);
            }
        }

        // Update button states
        function updateButtonStates(group, active) {
            if (group === 'camera') {
                document.getElementById('pauseBtn').classList.toggle('active', active === 'pause');
                document.getElementById('resumeBtn').classList.toggle('active', active === 'resume');
            } else if (group === 'mode') {
                document.getElementById('objectsBtn').classList.toggle('active', active === 'objects');
                document.getElementById('directionalBtn').classList.toggle('active', active === 'directional');
                document.getElementById('distanceBtn').classList.toggle('active', active === 'distance');
                document.getElementById('textBtn').classList.toggle('active', active === 'text');
            } else if (group === 'speech') {
                document.getElementById('startSpeechBtn').classList.toggle('active', active === 'start');
                document.getElementById('stopSpeechBtn').classList.toggle('active', active === 'stop');
            }
        }

        // Update status display
        async function updateStatus() {
            try {
                const response = await fetch('/stats');
                const stats = await response.json();
                
                document.getElementById('cameraStatus').textContent = stats.camera_on ? 'ON' : 'OFF';
                document.getElementById('cameraStatus').className = `status-value ${stats.camera_on ? 'status-on' : 'status-off'}`;
                
                document.getElementById('modeStatus').textContent = stats.mode.toUpperCase();
                
                document.getElementById('speechStatus').textContent = stats.speech_on ? 'ON' : 'OFF';
                document.getElementById('speechStatus').className = `status-value ${stats.speech_on ? 'status-on' : 'status-off'}`;
                
                // Update calibration inputs if available
                if (stats.known_width) {
                    document.getElementById('knownWidth').value = stats.known_width;
                }
                if (stats.focal_length) {
                    document.getElementById('focalLength').value = stats.focal_length;
                }
            } catch (error) {
                console.error('Status update error:', error);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus();
            
            // Update status every 5 seconds
            setInterval(updateStatus, 5000);
            
            // Handle video load errors gracefully
            const videoFeed = document.getElementById('videoFeed');
            videoFeed.onerror = function() {
                console.log('Video feed error, retrying...');
                setTimeout(() => {
                    videoFeed.src = '/video_feed?' + new Date().getTime();
                }, 2000);
            };
        });
    </script>
</body>
</html>
